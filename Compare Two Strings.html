<!DOCTYPE html>
<html>
<head><title>String Operations</title></head>
<body>
    <h1>string Operations</h1>

<script>
let str = "madam";

// Reverse
document.write("Reversed: " + str.split("").reverse().join("") + "<br>");

// Replace Characters
document.write("Replace 'a' with 'x': " + str.replace(/a/g, "x") + "<br>");

// Palindrome
if (str === str.split("").reverse().join(""))
  document.write("It is a Palindrome");
else
  document.write("Not a Palindrome");
</script>

</body>
</html>
