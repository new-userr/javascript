<!DOCTYPE html>
<html>
<head><title>Form Validation</title></head>
<body>
<h1>Student Information Form with Validation</h1>
<form onsubmit="return validate()">
Name: <input type="text" id="name"><br><br>
Mobile: <input type="text" id="mobile"><br><br>
Email: <input type="text" id="email"><br><br>
<input type="submit" value="Submit">
</form>

<script>
function validate() {
  let name = document.getElementById("name").value;
  let mobile = document.getElementById("mobile").value;
  let email = document.getElementById("email").value;

  if (!/^[A-Za-z ]+$/.test(name)) { alert("Invalid Name"); return false; }
  if (!/^[0-9]{10}$/.test(mobile)) { alert("Invalid Mobile"); return false; }
  if (!/^\S+@\S+\.\S+$/.test(email)) { alert("Invalid Email"); return false; }

  alert("Welcome " + name + "!");
  return true;
}
</script>

</body>
</html>
