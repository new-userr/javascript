<!DOCTYPE html>
<html>
<head><title>Background Change</title></head>
<h1>Background Change</h1>
<body id="bg" style="text-align:center; padding-top:50px;">

<button onmouseover="changeColor('yellow')" onmouseout="changeColor('white')" onfocus="changeColor('lightblue')">
Hover / Focus Me
</button>

<script>
function changeColor(color){
  document.getElementById("bg").style.backgroundColor = color;
}
</script>

</body>
</html>
