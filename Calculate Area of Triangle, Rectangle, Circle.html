<!DOCTYPE html>
<html>
<head><title>Area Calculation</title></head>
<body>

<script>
let base = 10, height = 5;
let triangle = 0.5 * base * height;

let length = 8, width = 4;
let rectangle = length * width;

let radius = 7;
let circle = Math.PI * radius * radius;

document.write("Area of Triangle: " + triangle + "<br>");
document.write("Area of Rectangle: " + rectangle + "<br>");
document.write("Area of Circle: " + circle + "<br>");
</script>

</body>
</html>
